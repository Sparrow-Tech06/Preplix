<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="container py-4">

  <h2 id="title" class="mb-4"></h2>
  <div id="content" class="row g-3"></div>

  <script>
    const sub = new URLSearchParams(location.search).get("subject");

    fetch("subject.json")
      .then(res => res.json())
      .then(data => {
        const item = data[sub];
        if (!item) return document.getElementById("title").innerText = "Subject Not Found!";

        document.getElementById("title").innerText = item.title;
        document.getElementById("content").innerHTML = item.topics.map(t => `
          <div class="col-md-4">
            <div class="card shadow-sm p-3">
              <h5 class="text-primary"><i class="bi bi-journal-text me-2"></i>${t.name}</h5>
              <a href="question.html?subject=${sub}&topic=${t.id}" class="btn btn-outline-primary btn-sm mt-2">
                Questions <i class="bi bi-chevron-right"></i>
              </a>
            </div>
          </div>
        `).join('');
      })
      .catch(() => document.getElementById("title").innerText = "Error loading data!");
  </script>
</body>
</html>
