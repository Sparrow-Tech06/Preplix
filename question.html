<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Questions | SciencePrep</title>

    <meta name="description"
          content="Practice competitive exam MCQs with answers and explanations.">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header class="site-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand brand" href="index.html">
                <span class="brand-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </span>
                <span>SciencePrep</span>
            </a>

            <button class="navbar-toggler border-0 shadow-none"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav"
                    aria-controls="mainNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <i class="bi bi-list fs-4"></i>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>
</header>


<main>

    <section class="question-header">

        <div class="container">

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb custom-breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="index.html">Home</a>
                    </li>

                    <li class="breadcrumb-item">
                        <a href="#" id="subjectBreadcrumb">
                            Subject
                        </a>
                    </li>

                    <li class="breadcrumb-item active"
                        aria-current="page"
                        id="topicBreadcrumb">
                        Questions
                    </li>
                </ol>
            </nav>

            <div class="question-title-row">

                <div>
                    <span class="section-label">PRACTICE MCQs</span>

                    <h1 id="questionTopic">
                        Loading...
                    </h1>

                    <p id="questionSubject">
                        Please wait...
                    </p>
                </div>

                <div class="question-total" id="questionTotal">
                    0
                </div>

            </div>

        </div>

    </section>


    <section class="questions-section">

        <div class="container">

            <div id="questionsContainer">

                <div class="loading-state">
                    <div class="spinner-border spinner-border-sm"
                         role="status"></div>

                    <span>Loading questions...</span>
                </div>

            </div>

        </div>

    </section>

</main>


<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">

            <div>
                <strong>SciencePrep</strong>
                <span> · General Science Learning</span>
            </div>

            <span>
                © <span class="current-year"></span>
            </span>

        </div>
    </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>

<script>
    loadQuestions();
</script>

</body>
</html>
