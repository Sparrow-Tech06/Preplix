<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Topics | SciencePrep</title>

    <meta name="description"
          content="Explore General Science topics and prepare for competitive exams.">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header class="site-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand brand" href="index.html">
                <span class="brand-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </span>
                <span>SciencePrep</span>
            </a>

            <button class="navbar-toggler border-0 shadow-none"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav"
                    aria-controls="mainNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <i class="bi bi-list fs-4"></i>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>
</header>

<main>

    <section class="page-header">
        <div class="container">

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb custom-breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="index.html">Home</a>
                    </li>
                    <li class="breadcrumb-item active"
                        aria-current="page"
                        id="breadcrumbSubject">
                        Topics
                    </li>
                </ol>
            </nav>

            <div class="subject-heading">

                <div class="subject-heading-icon" id="subjectIcon">
                    <i class="bi bi-book"></i>
                </div>

                <div>
                    <span class="section-label">SUBJECT</span>
                    <h1 id="subjectName">Loading...</h1>
                    <p id="subjectDescription">
                        Please wait...
                    </p>
                </div>

            </div>

        </div>
    </section>


    <section class="topics-section">

        <div class="container">

            <div class="section-heading compact">
                <div>
                    <span class="section-label">CHAPTERS</span>
                    <h2>Explore Topics</h2>
                </div>

                <span class="topic-count" id="topicCount">
                    0 Topics
                </span>
            </div>

            <div class="row g-3" id="topicsContainer">

                <div class="col-12">
                    <div class="loading-state">
                        <div class="spinner-border spinner-border-sm"
                             role="status"></div>
                        <span>Loading topics...</span>
                    </div>
                </div>

            </div>

        </div>

    </section>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-inner">

            <div>
                <strong>SciencePrep</strong>
                <span> · General Science Learning</span>
            </div>

            <span>
                © <span class="current-year"></span>
            </span>

        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>

<script>
    loadTopics();
</script>

</body>
</html>
