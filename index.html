<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-Math & Quiz Hub - Home</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    body {
      background-color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }

    /* CSS Grid Layout with minmax() */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    /* Horizontal Card Styling */
    .card-custom {
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-radius: 16px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.01);
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 16px;
      height: 100%;
    }

    .card-custom:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.06);
    }

    .card-img-left {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
    }

    /* Nth-child styling for each box background (Colorful Light Theme) */
    .topic-grid > div:nth-child(1) .card-custom {
      background-color: #eff6ff; /* Light Blue */
    }

    .topic-grid > div:nth-child(2) .card-custom {
      background-color: #f0fdf4; /* Light Green */
    }

    .topic-grid > div:nth-child(3) .card-custom {
      background-color: #fefce8; /* Light Yellow */
    }

    .topic-grid > div:nth-child(4) .card-custom {
      background-color: #fdf2f8; /* Light Pink */
    }

    .badge-slim {
      font-size: 0.7rem;
      padding: 0.3em 0.6em;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- Slim Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-mortarboard-fill text-primary me-2"></i>ExamQuiz Pro
      </a>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="fw-bold text-dark">Select a Chapter</h1>
      <p class="text-muted">Choose your topic below to start practicing dynamic MCQs.</p>
    </div>

    <!-- Topic Grid Container using CSS Grid minmax -->
    <div id="topicGrid" class="topic-grid">
      <!-- Dynamic cards will be injected here via script -->
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Main Script -->
  <script>
    const topics = [
      {
        id: "101",
        title: "Percentage & Ratio",
        description: "Master essential calculations and ratio proportions.",
        image: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "5082",
        title: "Speed & Distance",
        description: "Solve time, relative speed, and train problems.",
        image: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "99999",
        title: "Profit & Loss",
        description: "Practice marked price, discounts, and percentages.",
        image: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "104",
        title: "Algebra & Series",
        description: "Practice quadratic equations and progressions.",
        image: "https://images.unsplash.com/photo-1509228468518-180dd4864904?auto=format&fit=crop&w=500&q=80"
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      const gridContainer = document.getElementById("topicGrid");
      gridContainer.innerHTML = "";

      topics.forEach(topic => {
        const wrapperDiv = document.createElement("div");

        wrapperDiv.innerHTML = `
          <a href="quiz.html?id=${topic.id}" class="text-decoration-none">
            <div class="card card-custom">
              <img src="${topic.image}" class="card-img-left" alt="${topic.title}">
              <div class="card-body ps-3 py-0 pe-0">
                <span class="badge bg-primary-subtle text-primary mb-1 fw-semibold badge-slim">ID: ${topic.id}</span>
                <h5 class="card-title fw-bold text-dark mb-1 fs-6">${topic.title}</h5>
                <p class="card-text text-muted small mb-0" style="font-size: 0.82rem; line-height: 1.3;">${topic.description}</p>
              </div>
            </div>
          </a>
        `;

        gridContainer.appendChild(wrapperDiv);
      });
    });
  </script>
</body>
</html>
