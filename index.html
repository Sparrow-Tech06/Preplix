<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-Math & Quiz Hub - Home</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS CDN (for utilities & icons) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --border-color: #f1f5f9;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-hover: 0 12px 20px -5px rgba(37, 99, 235, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Slim Modern Header */
    .site-header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text-main);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Hero Section */
    .hero-section {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .hero-title {
      font-weight: 700;
      color: var(--text-main);
      font-size: 2rem;
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 500px;
      margin: 0.5rem auto 0;
    }

    /* Modern CSS Grid Layout (minmax) */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* Slim Card Custom Styling */
    .topic-card-link {
      text-decoration: none;
      color: inherit;
      display: block;
      height: 100%;
    }

    .card-custom {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .topic-card-link:hover .card-custom {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: #dbeafe;
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 140px;
      overflow: hidden;
      background-color: #e2e8f0;
    }

    .card-img-top {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .topic-card-link:hover .card-img-top {
      transform: scale(1.05);
    }

    .card-body-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .topic-badge {
      align-self: flex-start;
      background-color: var(--primary-light);
      color: var(--primary-color);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      letter-spacing: 0.03em;
    }

    .card-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .card-text {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .card-footer-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--primary-color);
      font-weight: 600;
      font-size: 0.875rem;
      padding-top: 0.75rem;
      border-top: 1px dashed #f1f5f9;
    }

    .card-footer-action i {
      transition: transform 0.2s ease;
    }

    .topic-card-link:hover .card-footer-action i {
      transform: translateX(4px);
    }

    /* Footer */
    .site-footer {
      margin-top: auto;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      padding: 1.5rem 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <!-- Semantic Header -->
  <header class="site-header py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="brand-logo" href="index.html">
        <i class="bi bi-mortarboard-fill text-primary"></i>
        <span>ExamQuiz <span class="text-primary">Pro</span></span>
      </a>
    </div>
  </header>

  <!-- Semantic Main Content -->
  <main class="container py-5">
    
    <!-- Hero Section -->
    <section class="hero-section">
      <h1 class="hero-title">Select a Chapter</h1>
      <p class="hero-subtitle">Choose your topic below to start practicing dynamic MCQs and boost your performance.</p>
    </section>

    <!-- Dynamic Topic Grid Section -->
    <section aria-label="Topics Navigation">
      <div id="topicGrid" class="topic-grid">
        <!-- JS will dynamic render <article> elements here -->
      </div>
    </section>

  </main>

  <!-- Semantic Footer -->
  <footer class="site-footer">
    <div class="container">
      <p class="mb-0">&copy; 2026 ExamQuiz Pro. All rights reserved.</p>
    </div>
  </footer>

  <!-- Main Script -->
  <script>
    // Topics Data
    const topics = [
      {
        id: "101",
        title: "Percentage & Ratio",
        description: "Master essential calculations, population growth, and ratio proportions.",
        image: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "5082",
        title: "Speed & Distance",
        description: "Solve time, relative speed, trains, and boat-stream problems.",
        image: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "99999",
        title: "Profit & Loss",
        description: "Advanced practice on marked price, discounts, and successive percentages.",
        image: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=500&q=80"
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      const gridContainer = document.getElementById("topicGrid");
      gridContainer.innerHTML = "";

      topics.forEach(topic => {
        // Using <article> for semantic card representation
        const article = document.createElement("article");

        article.innerHTML = `
          <a href="quiz.html?id=${topic.id}" class="topic-card-link" aria-label="${topic.title}">
            <div class="card-custom">
              <div class="card-img-wrapper">
                <img src="${topic.image}" class="card-img-top" alt="${topic.title}" loading="lazy">
              </div>
              <div class="card-body-content">
                <span class="topic-badge">ID: ${topic.id}</span>
                <h2 class="card-title">${topic.title}</h2>
                <p class="card-text">${topic.description}</p>
                <div class="card-footer-action">
                  <span>Start Practice</span>
                  <i class="bi bi-arrow-right"></i>
                </div>
              </div>
            </div>
          </a>
        `;

        gridContainer.appendChild(article);
      });
    });
  </script>

</body>
</html>
