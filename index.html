<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-Math & Quiz Hub - Home</title>

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    /* CSS Variables & Global Settings */
    :root {
      --bg-light: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #4f46e5;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    body {
      background-color: var(--bg-light);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      margin: 0;
    }

    /* Slim Navigation */
    .navbar {
      backdrop-filter: blur(10px);
      background-color: rgba(15, 23, 42, 0.95) !important;
    }

    /* CSS Grid Layout with minmax() */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* Modern Slim Card Styling */
    .card-custom {
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 16px;
      background: var(--card-bg);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .card-custom:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 30px -10px rgba(0, 0, 0, 0.08);
      border-color: rgba(79, 70, 229, 0.2);
    }

    .card-figure {
      margin: 0;
      position: relative;
      overflow: hidden;
      height: 160px;
    }

    .card-img-top {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card-custom:hover .card-img-top {
      transform: scale(1.05);
    }

    .badge-slim {
      font-size: 0.75rem;
      padding: 0.35em 0.75em;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* CSS nth-child Styling for dynamic variety */
    .topic-grid > a:nth-child(3n+1) .badge-slim {
      background-color: #e0e7ff;
      color: #4338ca;
    }

    .topic-grid > a:nth-child(3n+2) .badge-slim {
      background-color: #dcfce7;
      color: #15803d;
    }

    .topic-grid > a:nth-child(3n+3) .badge-slim {
      background-color: #fef3c7;
      color: #b45309;
    }

    .topic-grid > a:nth-child(even) .card-custom {
      background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
    }

    /* Arrow Icon Micro-animation */
    .btn-link-custom i {
      transition: transform 0.2s ease;
    }
    .card-custom:hover .btn-link-custom i {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
          <i class="bi bi-mortarboard-fill text-primary fs-4 me-2"></i>
          <span>ExamQuiz<span class="text-primary">Pro</span></span>
        </a>
      </div>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main class="container py-5">
    <!-- Hero/Title Section -->
    <section class="text-center mb-5">
      <h1 class="fw-bold display-6 text-dark mb-2">Select a Chapter</h1>
      <p class="text-muted col-md-8 mx-auto">Choose your topic below to start practicing dynamic MCQs tailored for competitive exams.</p>
    </section>

    <!-- Topic Grid Container (CSS Grid with minmax) -->
    <section id="topicGrid" class="topic-grid">
      <!-- Dynamic cards will be injected here via JavaScript -->
    </section>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Main Script -->
  <script>
    // Topics list
    const topics = [
      {
        id: "101",
        title: "Percentage & Ratio",
        description: "Master essential calculations, population growth, and ratio proportions.",
        image: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "5082",
        title: "Speed & Distance",
        description: "Solve time, relative speed, trains, and boat-stream problems efficiently.",
        image: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "99999",
        title: "Profit & Loss",
        description: "Advanced practice on marked price, discounts, and successive percentages.",
        image: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=500&q=80"
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      const gridContainer = document.getElementById("topicGrid");
      gridContainer.innerHTML = "";

      topics.forEach(topic => {
        // Semantic Wrapper Link
        const link = document.createElement("a");
        link.href = `quiz.html?id=${topic.id}`;
        link.className = "text-decoration-none text-reset";

        // Card Article Component
        link.innerHTML = `
          <article class="card card-custom">
            <figure class="card-figure">
              <img src="${topic.image}" class="card-img-top" alt="${topic.title}">
            </figure>
            <div class="card-body p-4 d-flex flex-column">
              <div class="mb-2">
                <span class="badge badge-slim fw-bold">ID: ${topic.id}</span>
              </div>
              <h2 class="h5 card-title fw-bold text-dark mb-2">${topic.title}</h2>
              <p class="card-text text-muted small mb-0 flex-grow-1">${topic.description}</p>
            </div>
            <footer class="card-footer bg-transparent border-0 px-4 pb-4 pt-0">
              <span class="btn-link-custom text-primary fw-semibold small d-inline-flex align-items-center">
                Start Practice <i class="bi bi-arrow-right ms-1"></i>
              </span>
            </footer>
          </article>
        `;

        gridContainer.appendChild(link);
      });
    });
  </script>
</body>
</html>
