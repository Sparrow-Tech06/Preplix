<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Session</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Slim Navbar -->
  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-arrow-left-circle me-2"></i>Back to Topics
      </a>
    </div>
  </nav>

  <!-- Quiz Content Container -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <!-- Header Info -->
        <div class="mb-4 text-center">
          <h2 id="quizTitle" class="fw-bold text-dark">Loading Quiz...</h2>
          <p id="quizSubtitle" class="text-muted small">Fetching exact topic data from JSON...</p>
        </div>

        <!-- Questions Dynamic Injection Container -->
        <div id="quizContainer">
          <!-- Questions will load here -->
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Quiz JS -->
  <script src="js/quiz.js"></script>
</body>
</html>
